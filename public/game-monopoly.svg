  <rect x="4" y="100" width="10" height="16" fill="#00cc44"/>
  <rect x="4" y="116" width="48" height="16" fill="#fff" stroke="#2d5a27" stroke-width="1"/>
  <rect x="4" y="116" width="10" height="16" fill="#00cc44"/>
  <rect x="4" y="132" width="48" height="16" fill="#fff" stroke="#2d5a27" stroke-width="1"/>
