  <text x="68" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#2d5a27">$</text>
  <text x="100" y="134" text-anchor="middle" font-family="Arial" font-size="12" fill="#2d5a27">💰</text>
  <text x="132" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#2d5a27">$</text>
