  <rect x="68" y="4" width="16" height="48" fill="#fff" stroke="#2d5a27" stroke-width="1"/>
  <rect x="68" y="4" width="16" height="10" fill="#00aaff"/>
  <rect x="84" y="4" width="16" height="48" fill="#fff" stroke="#2d5a27" stroke-width="1"/>
  <rect x="100" y="4" width="16" height="48" fill="#fff" stroke="#2d5a27" stroke-width="1"/>
  <rect x="100" y="4" width="16" height="10" fill="#ff44aa"/>
  <rect x="116" y="4" width="16" height="48" fill="#fff" stroke="#2d5a27" stroke-width="1"/>
  <rect x="116" y="4" width="16" height="10" fill="#ff44aa"/>
  <rect x="132" y="4" width="16" height="48" fill="#fff" stroke="#2d5a27" stroke-width="1"/>
