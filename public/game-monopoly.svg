<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background board -->
  <rect width="200" height="200" fill="#cde8c8"/>
  <!-- Outer border -->
  <rect x="4" y="4" width="192" height="192" rx="3" fill="none" stroke="#2d5a27" stroke-width="3"/>

  <!-- Corner squares -->
  <!-- GO corner (bottom-right) -->
  <rect x="148" y="148" width="48" height="48" fill="#ffffff" stroke="#2d5a27" stroke-width="1.5"/>
  <text x="172" y="167" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#cc0000">RECULL</text>
  <text x="172" y="178" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#cc0000">$200</text>
  <text x="172" y="190" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#2d5a27">en passar GO</text>

  <!-- Free Parking (top-left) -->
  <rect x="4" y="4" width="48" height="48" fill="#ffffff" stroke="#2d5a27" stroke-width="1.5"/>
  <text x="28" y="22" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#333">APARCA-</text>
  <text x="28" y="32" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#333">MENT</text>
  <text x="28" y="44" text-anchor="middle" font-family="Arial" font-size="16">🚗</text>

  <!-- Jail (top-right) -->
  <rect x="148" y="4" width="48" height="48" fill="#ffffff" stroke="#2d5a27" stroke-width="1.5"/>
  <text x="172" y="22" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#333">VISITA</text>
  <text x="172" y="32" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#333">A LA</text>
  <text x="172" y="44" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#333">PRESÓ ⚠️</text>

  <!-- Go to jail (bottom-left) -->
  <rect x="4" y="148" width="48" height="48" fill="#ffffff" stroke="#2d5a27" stroke-width="1.5"/>
  <text x="28" y="165" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#cc0000">VÉS A LA</text>
  <text x="28" y="176" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#cc0000">PRESÓ</text>
  <text x="28" y="190" text-anchor="middle" font-family="Arial" font-size="14">🚔</text>

  <!-- Top edge properties -->
