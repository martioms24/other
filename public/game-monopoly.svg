  <rect x="52" y="186" width="16" height="10" fill="#8b0000" rx="0"/>
  <rect x="68" y="148" width="16" height="48" fill="#fff" stroke="#2d5a27" stroke-width="1"/>
  <rect x="68" y="186" width="16" height="10" fill="#8b0000"/>
  <rect x="84" y="148" width="16" height="48" fill="#fff" stroke="#2d5a27" stroke-width="1"/>
  <rect x="100" y="148" width="16" height="48" fill="#fff" stroke="#2d5a27" stroke-width="1"/>
  <rect x="100" y="186" width="16" height="10" fill="#ff8800"/>
  <rect x="116" y="148" width="16" height="48" fill="#fff" stroke="#2d5a27" stroke-width="1"/>
  <rect x="116" y="186" width="16" height="10" fill="#ff8800"/>
  <rect x="132" y="148" width="16" height="48" fill="#fff" stroke="#2d5a27" stroke-width="1"/>
