<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#f5e6c8"/>
  <!-- Title banner -->
  <rect x="10" y="10" width="180" height="28" rx="4" fill="#8b3a0f"/>
  <text x="100" y="29" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#f5e6c8" letter-spacing="2">CARCASSONNE</text>

  <!-- Tile 1: Top-left - city tile -->
  <rect x="10" y="44" width="56" height="56" rx="2" fill="#7ec8a0"/>
  <path d="M10 44 L66 44 L66 70 Q38 58 10 70 Z" fill="#c0845a"/>
  <rect x="27" y="44" width="12" height="22" fill="#b87040"/>
  <rect x="25" y="40" width="7" height="8" fill="#a05030"/>
  <rect x="34" y="40" width="7" height="8" fill="#a05030"/>
  <!-- Road on tile 1 -->
  <path d="M38 100 L38 80" stroke="#d4b896" stroke-width="4" fill="none"/>

  <!-- Tile 2: Top-center - field with road -->
  <rect x="72" y="44" width="56" height="56" rx="2" fill="#7ec8a0"/>
  <path d="M72 72 Q100 65 128 72" stroke="#d4b896" stroke-width="5" fill="none"/>

  <!-- Tile 3: Top-right - monastery -->
  <rect x="134" y="44" width="56" height="56" rx="2" fill="#7ec8a0"/>
  <rect x="155" y="62" width="22" height="22" fill="#c0845a"/>
  <polygon points="155,62 177,62 166,50" fill="#a05030"/>
  <rect x="163" y="71" width="6" height="13" fill="#8b3a0f"/>

  <!-- Tile 4: Middle-left - city -->
  <rect x="10" y="106" width="56" height="56" rx="2" fill="#7ec8a0"/>
  <rect x="10" y="106" width="56" height="30" fill="#c0845a"/>
  <rect x="20" y="106" width="10" height="15" fill="#a05030"/>
  <rect x="36" y="106" width="10" height="15" fill="#a05030"/>
  <rect x="52" y="106" width="10" height="15" fill="#a05030"/>
  <!-- Meeple -->
  <ellipse cx="38" cy="145" rx="5" ry="5" fill="#cc3333"/>
  <rect x="35" y="150" width="6" height="8" rx="2" fill="#cc3333"/>

  <!-- Tile 5: Middle-center - crossroads -->
  <rect x="72" y="106" width="56" height="56" rx="2" fill="#7ec8a0"/>
  <path d="M100 106 L100 162" stroke="#d4b896" stroke-width="5" fill="none"/>
  <path d="M72 134 L128 134" stroke="#d4b896" stroke-width="5" fill="none"/>
  <circle cx="100" cy="134" r="7" fill="#d4b896"/>

  <!-- Tile 6: Middle-right - field -->
  <rect x="134" y="106" width="56" height="56" rx="2" fill="#7ec8a0"/>
  <path d="M134 134 L162 134" stroke="#d4b896" stroke-width="5" fill="none"/>

  <!-- Score track border -->
  <rect x="10" y="168" width="180" height="22" rx="4" fill="#8b3a0f" opacity="0.7"/>
  <circle cx="28" cy="179" r="6" fill="#cc3333"/>
  <circle cx="44" cy="179" r="6" fill="#3399cc"/>
  <circle cx="60" cy="179" r="6" fill="#33cc66"/>
  <text x="120" y="184" text-anchor="middle" font-family="Arial" font-size="11" fill="#f5e6c8">punts: 0 · 0 · 0</text>
</svg>
