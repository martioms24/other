<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <rect width="200" height="200" fill="#F0F8FF" rx="16"/>
  <!-- Ice cream cone -->
  <!-- Waffle cone -->
  <path d="M75 125 L100 178 L125 125 Z" fill="#D4A05A"/>
  <!-- Cone grid lines -->
  <line x1="75" y1="125" x2="100" y2="178" stroke="#B88040" stroke-width="1"/>
  <line x1="125" y1="125" x2="100" y2="178" stroke="#B88040" stroke-width="1"/>
  <line x1="80" y1="138" x2="116" y2="138" stroke="#B88040" stroke-width="0.8"/>
  <line x1="84" y1="150" x2="112" y2="150" stroke="#B88040" stroke-width="0.8"/>
  <line x1="89" y1="162" x2="108" y2="162" stroke="#B88040" stroke-width="0.8"/>
  <!-- Diagonal lines -->
  <line x1="86" y1="125" x2="93" y2="178" stroke="#B88040" stroke-width="0.8" opacity="0.7"/>
  <line x1="100" y1="125" x2="100" y2="178" stroke="#B88040" stroke-width="0.8" opacity="0.7"/>
  <line x1="114" y1="125" x2="107" y2="178" stroke="#B88040" stroke-width="0.8" opacity="0.7"/>
  <!-- Top cone rim -->
  <rect x="73" y="122" width="54" height="8" rx="3" fill="#C89040"/>
  <!-- Scoop 3 - chocolate (bottom) -->
  <ellipse cx="100" cy="108" rx="32" ry="22" fill="#6B3A1F"/>
  <ellipse cx="100" cy="102" rx="30" ry="20" fill="#7D4535"/>
  <!-- Scoop 2 - strawberry (middle) -->
  <ellipse cx="100" cy="82" rx="30" ry="22" fill="#E87070"/>
  <ellipse cx="100" cy="76" rx="28" ry="20" fill="#EF8080"/>
  <!-- Scoop 1 - vanilla (top) -->
  <ellipse cx="100" cy="58" rx="28" ry="22" fill="#FFF5DC"/>
  <ellipse cx="100" cy="52" rx="26" ry="20" fill="#FFFAF0"/>
  <!-- Highlight on scoops -->
  <circle cx="89" cy="46" r="8" fill="rgba(255,255,255,0.5)"/>
  <circle cx="89" cy="70" r="7" fill="rgba(255,255,255,0.3)"/>
  <circle cx="89" cy="96" r="6" fill="rgba(255,255,255,0.2)"/>
  <!-- Sprinkles on vanilla -->
  <line x1="95" y1="48" x2="100" y2="44" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="50" x2="110" y2="46" stroke="#4ECDC4" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="58" x2="106" y2="54" stroke="#FFE66D" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="52" x2="112" y2="58" stroke="#A29BFE" stroke-width="3" stroke-linecap="round"/>
  <!-- Drip -->
  <path d="M128 72 Q133 82 130 90" stroke="#EF8080" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Label -->
  <text x="100" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#4ECDC4">Gelat</text>
</svg>
