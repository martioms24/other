  <path d="M52 148 L100 78 L148 148 Z" fill="#FFF5E0"/>
  <path d="M52 148 L100 78 L148 148 Z" fill="#FFFAF5"/>
  <!-- Graham cracker crust on bottom -->
  <path d="M50 150 L100 150 L150 150 L148 155 L52 155 Z" fill="#C8A060"/>
  <path d="M50 150 L100 150 L150 150" fill="none" stroke="#A07840" stroke-width="2"/>
  <!-- Strawberry topping -->
  <!-- Strawberries on top of slice -->
  <circle cx="100" cy="92" r="10" fill="#E8503A"/>
  <path d="M95 88 Q100 82 105 88" fill="#C0392B"/>
  <path d="M92 92 Q96 86 100 90 Q104 86 108 92" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
