  <path d="M97 83 Q100 78 103 83" fill="#27AE60"/>
  <path d="M95 84 Q100 80 105 84" fill="none" stroke="#27AE60" stroke-width="1.5"/>
  <!-- Strawberry seeds -->
  <ellipse cx="97" cy="91" rx="1" ry="1.5" fill="#FFE0D0" transform="rotate(-20 97 91)"/>
  <ellipse cx="103" cy="91" rx="1" ry="1.5" fill="#FFE0D0" transform="rotate(20 103 91)"/>
  <ellipse cx="100" cy="95" rx="1" ry="1.5" fill="#FFE0D0"/>
  <!-- Berry sauce drips -->
  <path d="M90 100 Q85 110 88 118" stroke="#E8503A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M110 100 Q115 112 112 122" stroke="#E8503A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Whipped cream swirl on slice -->
  <path d="M75 130 Q80 122 88 125 Q85 118 92 120 Q95 115 100 118" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Cream cheese texture -->
  <path d="M58 140 Q80 136 100 138 Q120 136 142 140" fill="none" stroke="rgba(200,180,140,0.3)" stroke-width="6"/>
  <!-- Label -->
  <text x="100" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#C8784A">Pastís de formatge</text>
