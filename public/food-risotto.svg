<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <rect width="200" height="200" fill="#FFFBF0" rx="16"/>
  <!-- Bowl shadow -->
  <ellipse cx="100" cy="155" rx="68" ry="10" fill="rgba(0,0,0,0.08)"/>
  <!-- Bowl outer -->
  <path d="M30 100 Q30 158 100 158 Q170 158 170 100 L160 88 Q160 148 100 148 Q40 148 40 88 Z" fill="#E8E0D0"/>
  <!-- Bowl inner (food) -->
  <ellipse cx="100" cy="95" rx="68" ry="20" fill="#F5E6C0"/>
  <path d="M32 95 Q32 150 100 150 Q168 150 168 95" fill="#F0DDA0"/>
  <!-- Risotto surface -->
  <ellipse cx="100" cy="95" rx="65" ry="18" fill="#F0DDA0"/>
  <!-- Rice grains texture -->
  <ellipse cx="80" cy="93" rx="5" ry="2" fill="#E8CE88" transform="rotate(-20 80 93)"/>
  <ellipse cx="95" cy="89" rx="5" ry="2" fill="#E8CE88" transform="rotate(10 95 89)"/>
  <ellipse cx="112" cy="91" rx="5" ry="2" fill="#E8CE88" transform="rotate(-5 112 91)"/>
  <ellipse cx="75" cy="99" rx="4" ry="2" fill="#E8CE88" transform="rotate(15 75 99)"/>
  <ellipse cx="125" cy="96" rx="4" ry="2" fill="#E8CE88" transform="rotate(-15 125 96)"/>
  <ellipse cx="105" cy="100" rx="5" ry="2" fill="#E8CE88" transform="rotate(5 105 100)"/>
  <ellipse cx="88" cy="103" rx="4" ry="2" fill="#E8CE88" transform="rotate(-10 88 103)"/>
  <!-- Parmesan shavings -->
  <ellipse cx="100" cy="90" rx="12" ry="4" fill="rgba(255,255,255,0.7)" transform="rotate(-15 100 90)"/>
  <ellipse cx="85" cy="95" rx="8" ry="3" fill="rgba(255,255,255,0.6)" transform="rotate(20 85 95)"/>
  <ellipse cx="115" cy="94" rx="9" ry="3" fill="rgba(255,255,255,0.6)" transform="rotate(-5 115 94)"/>
  <!-- Herbs (parsley) -->
  <circle cx="100" cy="88" r="5" fill="#5A9A5A"/>
  <circle cx="98" cy="86" r="3" fill="#6DB86D"/>
  <circle cx="102" cy="86" r="3" fill="#6DB86D"/>
  <!-- Bowl rim highlight -->
  <ellipse cx="100" cy="95" rx="65" ry="18" fill="none" stroke="#D4C080" stroke-width="2"/>
  <!-- Bowl highlight -->
  <path d="M32 95 Q32 130 55 148" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round"/>
  <!-- Label -->
  <text x="100" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#C8A84B">Risotto</text>
</svg>
