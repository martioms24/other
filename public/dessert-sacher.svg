<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <rect width="200" height="200" fill="#1A0A05" rx="16"/>
  <!-- Plate -->
  <ellipse cx="100" cy="162" rx="72" ry="11" fill="#2A1A0F"/>
  <ellipse cx="100" cy="159" rx="69" ry="9" fill="#3A2A1F"/>
  <!-- Cake slice -->
  <!-- Back face -->
  <path d="M50 140 L50 100 L150 100 L150 140 Z" fill="#2D1206"/>
  <!-- Chocolate glaze top layer -->
  <path d="M50 100 L150 100 L155 95 L55 95 Z" fill="#1A0A02"/>
  <!-- Main chocolate body -->
  <rect x="50" y="100" width="100" height="42" rx="0" fill="#3D1A0A"/>
  <!-- Apricot jam layer (signature) -->
  <rect x="50" y="120" width="100" height="6" fill="#E8904A"/>
  <rect x="50" y="120" width="100" height="3" fill="#F0A060"/>
  <!-- Sponge layer 1 -->
  <rect x="50" y="100" width="100" height="20" fill="#3D1A0A"/>
  <!-- Sponge texture -->
  <rect x="50" y="108" width="100" height="2" fill="rgba(80,40,15,0.5)"/>
  <rect x="50" y="114" width="100" height="2" fill="rgba(80,40,15,0.5)"/>
  <!-- Sponge layer 2 -->
  <rect x="50" y="126" width="100" height="16" fill="#3D1A0A"/>
  <!-- Glossy chocolate glaze on top -->
  <rect x="50" y="95" width="100" height="10" rx="2" fill="#1A0805"/>
  <path d="M52 97 Q100 93 148 97" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
  <!-- Chocolate drips on side -->
  <path d="M55 100 Q53 112 55 118" stroke="#150604" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M142 100 Q145 110 143 116" stroke="#150604" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M80 100 Q78 108 80 113" stroke="#150604" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M115 100 Q117 107 115 112" stroke="#150604" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- "Sacher" text on glaze (traditional) -->
  <text x="100" y="104" text-anchor="middle" font-family="serif" font-size="9" font-weight="bold" fill="rgba(200,160,100,0.8)" font-style="italic">Sacher</text>
  <!-- Whipped cream on side -->
  <path d="M155 130 Q162 125 168 132 Q165 138 160 136 Q163 142 158 144 Q156 138 155 130 Z" fill="white"/>
  <!-- Highlight on glaze -->
  <path d="M60 97 Q90 94 100 96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Label -->
  <text x="100" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#E8904A">Pastís Sacher</text>
</svg>
