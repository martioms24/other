<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <rect width="200" height="200" fill="#1A0A00" rx="16"/>
  <!-- Glow from lava -->
  <radialGradient id="lavaGlow" cx="50%" cy="80%" r="50%">
    <stop offset="0%" stop-color="#FF8C00" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#1A0A00" stop-opacity="0"/>
  </radialGradient>
  <rect width="200" height="200" fill="url(#lavaGlow)" rx="16"/>
  <!-- Plate -->
  <ellipse cx="100" cy="162" rx="68" ry="10" fill="#1E0E04"/>
  <ellipse cx="100" cy="158" rx="65" ry="8" fill="#2A1404"/>
  <!-- Coulant body -->
  <rect x="58" y="95" width="84" height="66" rx="14" fill="#1E0804"/>
  <rect x="60" y="95" width="80" height="64" rx="12" fill="#2D1008"/>
  <!-- Crust top -->
  <ellipse cx="100" cy="97" rx="42" ry="13" fill="#2D1008"/>
  <ellipse cx="100" cy="94" rx="40" ry="11" fill="#381410"/>
  <!-- Crack/opening -->
  <path d="M90 88 Q100 82 110 88 Q108 94 100 96 Q92 94 90 88 Z" fill="#FF6B00"/>
  <!-- Lava flowing out -->
  <path d="M88 90 Q85 100 82 112 Q80 122 84 130 Q90 138 100 140 Q110 138 116 130 Q120 122 118 112 Q115 100 112 90" fill="#FF8C00" opacity="0.9"/>
  <path d="M90 90 Q87 102 85 115 Q84 125 88 134 Q94 141 100 142 Q106 141 112 134 Q116 125 115 115 Q113 102 110 90" fill="#FFA500" opacity="0.8"/>
  <path d="M93 92 Q90 105 89 118 Q89 128 93 136 Q97 143 100 144 Q103 143 107 136 Q111 128 111 118 Q110 105 107 92" fill="#FFD700" opacity="0.6"/>
  <!-- Lava highlights/glow -->
  <path d="M95 95 Q96 108 95 120" stroke="rgba(255,255,150,0.7)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Chocolate exterior texture -->
  <path d="M62 115 Q100 110 138 115" fill="none" stroke="rgba(60,20,5,0.5)" stroke-width="8"/>
  <path d="M60 130 Q100 126 140 130" fill="none" stroke="rgba(60,20,5,0.4)" stroke-width="6"/>
  <!-- Steam/smoke wisps -->
  <path d="M85 80 Q83 72 86 65 Q88 58 85 50" stroke="rgba(200,150,100,0.3)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M100 78 Q98 70 101 63 Q103 56 100 48" stroke="rgba(200,150,100,0.25)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M115 80 Q117 72 114 65 Q112 58 115 50" stroke="rgba(200,150,100,0.2)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Powdered sugar dusting -->
  <circle cx="70" cy="104" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="130" cy="106" r="2" fill="rgba(255,255,255,0.6)"/>
  <circle cx="65" cy="118" r="1.5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="135" cy="120" r="1.5" fill="rgba(255,255,255,0.5)"/>
  <!-- Label -->
  <text x="100" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#FFA500">Coulant de xocolata</text>
</svg>
