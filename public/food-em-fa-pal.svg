<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <rect width="200" height="200" fill="#FFF8F5" rx="16"/>
  <!-- Face -->
  <circle cx="100" cy="90" r="55" fill="#FFD93D"/>
  <circle cx="100" cy="90" r="55" fill="none" stroke="#F0C020" stroke-width="3"/>
  <!-- Highlight -->
  <circle cx="80" cy="72" r="12" fill="rgba(255,255,255,0.3)"/>
  <!-- Eyes - confused -->
  <circle cx="82" cy="80" r="6" fill="#3D3D3D"/>
  <circle cx="118" cy="80" r="6" fill="#3D3D3D"/>
  <!-- Eye highlights -->
  <circle cx="84" cy="78" r="2" fill="white"/>
  <circle cx="120" cy="78" r="2" fill="white"/>
  <!-- One eyebrow raised, one normal -->
  <path d="M76 68 Q82 65 88 68" stroke="#8B6914" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M112 64 Q118 60 124 64" stroke="#8B6914" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Confused squiggly mouth -->
  <path d="M82 108 Q90 103 100 108 Q110 113 118 108" stroke="#8B6914" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Sweat drop -->
  <path d="M130 70 Q133 65 136 70 Q136 76 133 76 Q130 76 130 70 Z" fill="#74D7FF"/>
  <!-- Shrug arms -->
  <!-- Left arm up -->
  <path d="M50 105 Q38 90 42 75" stroke="#FFD93D" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M50 105 Q38 90 42 75" stroke="#F0C020" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Left hand -->
  <circle cx="42" cy="72" r="10" fill="#FFD93D" stroke="#F0C020" stroke-width="2"/>
  <!-- Right arm up -->
  <path d="M150 105 Q162 90 158 75" stroke="#FFD93D" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M150 105 Q162 90 158 75" stroke="#F0C020" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Right hand -->
  <circle cx="158" cy="72" r="10" fill="#FFD93D" stroke="#F0C020" stroke-width="2"/>
  <!-- Question marks -->
  <text x="28" y="55" font-family="system-ui,sans-serif" font-size="18" font-weight="900" fill="#FF9F43">?</text>
  <text x="162" y="50" font-family="system-ui,sans-serif" font-size="18" font-weight="900" fill="#FF9F43">?</text>
  <!-- Label -->
  <text x="100" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#FF9F43">Em fa pal pensar-lo</text>
</svg>
