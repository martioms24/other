<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Hex clip path helper -->
  </defs>
  <!-- Ocean background -->
  <rect width="200" height="200" fill="#5b9bd5"/>

  <!-- Helper: flat-top hexagon at cx,cy with size r -->
  <!-- r=28, flat-top: points offset by 30deg -->
  <!-- Row 1: 3 hexes centered at y=44 -->

  <!-- Hex function: flat-top hex, r=28 -->
  <!-- Points: (cx+r, cy), (cx+r/2, cy+r*0.866), (cx-r/2, cy+r*0.866), (cx-r, cy), (cx-r/2, cy-r*0.866), (cx+r/2, cy-r*0.866) -->
  <!-- r=27, spacing: x=27*1.5=40.5, y=27*sqrt(3)/2*2=46.8 -->

  <!-- Row 1 (3 hexes): y_center = 52 -->
  <!-- x centers: 68, 108, 148... actually let me center the board -->
  <!-- Board: 3+4+5+4+3 = 19 hexes in standard Catan -->
  <!-- Let me just do a simplified 3-4-3 grid that looks like Catan -->

  <!-- r=26, flat-top -->
  <!-- Row 1: 3 hexes, x = 72, 124, 176... nah, let me calculate properly -->
  <!-- flat-top hex: width = 2r, height = r*sqrt(3) -->
  <!-- r=23, width=46, height=39.8≈40 -->
  <!-- horizontal spacing (center to center) = 1.5*2r = 3r = 69... too wide -->
  <!-- Let me use r=22 -->
  <!-- width=44, height=38 -->
  <!-- horiz spacing = 33, vert spacing = 38 -->

  <!-- Pointy-top hex is easier to tile -->
  <!-- pointy-top: width=r*sqrt(3), height=2r -->
  <!-- r=22: w=38, h=44 -->
  <!-- horiz spacing = 38, vert spacing = 33 (3r/2) -->

  <!-- Row 1 (3 hexes, y=38): x = 62, 100, 138 -->
  <polygon points="62,16 81,27 81,49 62,60 43,49 43,27" fill="#228b22" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="62" y="44" text-anchor="middle" font-size="18">🌲</text>

  <polygon points="100,16 119,27 119,49 100,60 81,49 81,27" fill="#daa520" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="100" y="44" text-anchor="middle" font-size="18">🌾</text>

  <polygon points="138,16 157,27 157,49 138,60 119,49 119,27" fill="#cd853f" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="138" y="44" text-anchor="middle" font-size="18">⛰️</text>

  <!-- Row 2 (4 hexes, y=71): x = 43, 81, 119, 157 -->
  <polygon points="43,49 62,60 62,82 43,93 24,82 24,60" fill="#daa520" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="43" y="77" text-anchor="middle" font-size="18">🌾</text>

  <polygon points="81,49 100,60 100,82 81,93 62,82 62,60" fill="#808080" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="81" y="77" text-anchor="middle" font-size="18">🪨</text>

  <polygon points="119,49 138,60 138,82 119,93 100,82 100,60" fill="#228b22" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="119" y="77" text-anchor="middle" font-size="18">🌲</text>

  <polygon points="157,49 176,60 176,82 157,93 138,82 138,60" fill="#c2a040" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="157" y="77" text-anchor="middle" font-size="18">🐑</text>

  <!-- Row 3 (5 hexes, y=104): x = 24, 62, 100, 138, 176 -->
  <polygon points="24,82 43,93 43,115 24,126 5,115 5,93" fill="#c2a040" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="24" y="110" text-anchor="middle" font-size="18">🐑</text>

  <polygon points="62,82 81,93 81,115 62,126 43,115 43,93" fill="#cd853f" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="62" y="110" text-anchor="middle" font-size="18">⛰️</text>

  <!-- Desert (center) -->
  <polygon points="100,82 119,93 119,115 100,126 81,115 81,93" fill="#f4d03f" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="100" y="107" text-anchor="middle" font-size="14">🏜️</text>
  <text x="100" y="120" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#8b4513">DESERT</text>

  <polygon points="138,82 157,93 157,115 138,126 119,115 119,93" fill="#228b22" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="138" y="110" text-anchor="middle" font-size="18">🌲</text>

  <polygon points="176,82 195,93 195,115 176,126 157,115 157,93" fill="#daa520" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="176" y="110" text-anchor="middle" font-size="18">🌾</text>

  <!-- Row 4 (4 hexes, y=137): x = 43, 81, 119, 157 -->
  <polygon points="43,115 62,126 62,148 43,159 24,148 24,126" fill="#cd853f" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="43" y="143" text-anchor="middle" font-size="18">⛰️</text>

  <polygon points="81,115 100,126 100,148 81,159 62,148 62,126" fill="#808080" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="81" y="143" text-anchor="middle" font-size="18">🪨</text>

  <polygon points="119,115 138,126 138,148 119,159 100,148 100,126" fill="#c2a040" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="119" y="143" text-anchor="middle" font-size="18">🐑</text>

  <polygon points="157,115 176,126 176,148 157,159 138,148 138,126" fill="#228b22" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="157" y="143" text-anchor="middle" font-size="18">🌲</text>

  <!-- Row 5 (3 hexes, y=170): x = 62, 100, 138 -->
  <polygon points="62,148 81,159 81,181 62,192 43,181 43,159" fill="#daa520" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="62" y="176" text-anchor="middle" font-size="18">🌾</text>

  <polygon points="100,148 119,159 119,181 100,192 81,181 81,159" fill="#808080" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="100" y="176" text-anchor="middle" font-size="18">🪨</text>

  <polygon points="138,148 157,159 157,181 138,192 119,181 119,159" fill="#c2a040" stroke="#3d2b1f" stroke-width="1.5"/>
  <text x="138" y="176" text-anchor="middle" font-size="18">🐑</text>

  <!-- Title -->
  <rect x="0" y="0" width="200" height="14" fill="rgba(93,60,30,0.85)"/>
  <text x="100" y="11" text-anchor="middle" font-family="Georgia,serif" font-size="9" font-weight="bold" fill="#f5e6c8" letter-spacing="3">CATAN</text>
</svg>
