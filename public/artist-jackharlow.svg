<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <rect width="200" height="200" fill="#1A1A2E" rx="16"/>
  <!-- Background glow -->
  <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#6B46C1" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#1A1A2E" stop-opacity="0"/>
  </radialGradient>
  <rect width="200" height="200" fill="url(#glow1)" rx="16"/>
  <!-- Silhouette body -->
  <ellipse cx="100" cy="145" rx="48" ry="35" fill="#2D2D4E"/>
  <!-- Neck -->
  <rect x="88" y="110" width="24" height="22" rx="4" fill="#8B7355"/>
  <!-- Head -->
  <ellipse cx="100" cy="95" rx="32" ry="36" fill="#8B7355"/>
  <!-- Hair - wavy blonde/light -->
  <path d="M68 82 Q70 55 100 52 Q130 55 132 82 Q132 68 128 60 Q115 42 100 40 Q85 42 72 60 Q68 68 68 82 Z" fill="#E8D5A3"/>
  <path d="M68 82 Q66 92 68 98 Q65 85 68 82 Z" fill="#D4BF8C"/>
  <path d="M132 82 Q134 92 132 98 Q135 85 132 82 Z" fill="#D4BF8C"/>
  <!-- Face features -->
  <ellipse cx="88" cy="90" rx="4" ry="5" fill="#2D1A0E"/>
  <ellipse cx="112" cy="90" rx="4" ry="5" fill="#2D1A0E"/>
  <path d="M90 108 Q100 113 110 108" stroke="#5A3520" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Slight smile -->
  <path d="M90 108 Q100 114 110 108" stroke="#5A3520" stroke-width="2" fill="rgba(200,120,100,0.3)"/>
  <!-- Microphone -->
  <rect x="92" y="122" width="16" height="28" rx="8" fill="#CCCCCC"/>
  <rect x="88" y="130" width="24" height="16" rx="12" fill="none" stroke="#AAAAAA" stroke-width="2"/>
  <rect x="92" y="150" width="16" height="4" rx="2" fill="#AAAAAA"/>
  <circle cx="100" cy="158" r="3" fill="#888888"/>
  <!-- Name -->
  <text x="100" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#E8D5A3">Jack Harlow</text>
  <!-- Small music note decorations -->
  <text x="30" y="50" font-family="system-ui,sans-serif" font-size="16" fill="rgba(232,213,163,0.3)">♪</text>
  <text x="162" y="45" font-family="system-ui,sans-serif" font-size="14" fill="rgba(232,213,163,0.3)">♫</text>
</svg>
